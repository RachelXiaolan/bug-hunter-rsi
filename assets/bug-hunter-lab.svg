<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bug Hunter 数字取证实验室</title>
  <desc id="desc">一束扫描光穿过代码样本，定位异常分支，并将缺陷封装为带编号的标本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1729d7"/>
      <stop offset="0.58" stop-color="#0f1f78"/>
      <stop offset="1" stop-color="#071027"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#f5ff88" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#a8ff53" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a8ff53" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dce5ff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="30" fill="url(#grid)"/>
  <path d="M0 618C180 560 314 690 488 612s294-84 430-8 210 38 282-8v164H0Z" fill="#071027" fill-opacity=".54"/>

  <g transform="translate(82 92)">
    <rect width="450" height="498" rx="24" fill="#071027" fill-opacity=".78" stroke="#6f82ff" stroke-opacity=".52"/>
    <circle cx="34" cy="34" r="6" fill="#ff6b55"/><circle cx="56" cy="34" r="6" fill="#ffd45b"/><circle cx="78" cy="34" r="6" fill="#a8ff53"/>
    <path d="M32 78H418" stroke="#6f82ff" stroke-opacity=".36"/>
    <g fill="none" stroke-linecap="round" stroke-width="12">
      <path d="M42 122h72m22 0h138m22 0h70" stroke="#7d8bf8"/>
      <path d="M62 166h88m22 0h178" stroke="#e7ebff" stroke-opacity=".72"/>
      <path d="M62 210h42m22 0h108m22 0h76" stroke="#a8ff53"/>
      <path d="M82 254h118m22 0h152" stroke="#e7ebff" stroke-opacity=".5"/>
      <path d="M82 298h54m22 0h88m22 0h122" stroke="#ff765e"/>
      <path d="M62 342h100m22 0h56m22 0h74" stroke="#e7ebff" stroke-opacity=".66"/>
      <path d="M42 386h78m22 0h188" stroke="#7d8bf8"/>
      <path d="M42 430h148m22 0h116" stroke="#e7ebff" stroke-opacity=".48"/>
    </g>
    <rect x="52" y="188" width="316" height="132" rx="14" fill="#a8ff53" fill-opacity=".08" stroke="#a8ff53" stroke-dasharray="8 8"/>
  </g>

  <g transform="translate(724 310)">
    <circle r="224" fill="url(#lens)"/>
    <circle r="148" fill="#efffbd" fill-opacity=".08" stroke="#d8ff73" stroke-width="14"/>
    <circle r="124" fill="#08174d" fill-opacity=".72" stroke="#f2ff9b" stroke-opacity=".7"/>
    <path d="M103 103l178 178" stroke="#d8ff73" stroke-width="38" stroke-linecap="round"/>
    <path d="M101 101l180 180" stroke="#f7ffd4" stroke-width="10" stroke-linecap="round" stroke-opacity=".8"/>
    <g filter="url(#glow)" fill="#ff765e" stroke="#ffe0d8" stroke-width="5">
      <ellipse cx="-12" cy="-5" rx="35" ry="45"/>
      <circle cx="-12" cy="-52" r="18"/>
      <path d="M-42-32l-33-25m63 6V-91m31 59l34-25M-47 0l-42 4m77 22v48m35-74l43 4" fill="none" stroke-linecap="round"/>
      <path d="M-14-32v62M-43-10h62" fill="none" stroke="#7d1c30"/>
    </g>
    <circle cx="82" cy="-76" r="9" fill="#a8ff53"/>
    <circle cx="-91" cy="68" r="6" fill="#a8ff53"/>
  </g>

  <g transform="translate(842 84)">
    <rect width="270" height="112" rx="18" fill="#f3f0e8"/>
    <path d="M30 35h78M30 58h136M30 81h104" stroke="#132284" stroke-width="10" stroke-linecap="round" opacity=".82"/>
    <circle cx="224" cy="56" r="26" fill="#a8ff53"/>
    <path d="m212 57 9 9 18-23" fill="none" stroke="#071027" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M534 250c60-34 92-21 128 14" fill="none" stroke="#a8ff53" stroke-width="6" stroke-dasharray="5 16" stroke-linecap="round"/>
  <circle cx="648" cy="256" r="9" fill="#a8ff53"/>
</svg>

name = "bug-hunter-rsi"
main = "src/index.js"
compatibility_date = "2026-09-23"

# Secrets (set as type Secret in the dashboard, never here): CMD_API_KEY, GITHUB_TOKEN, HUNTER_TOKEN
[vars]
# Team repos. Default write policy is readonly; append :review or :pr to allow more.
INTERNAL_REPOS = ""
# Open-source seed repos (default write policy pr), e.g. "owner/repo". Discovery adds more from the playbook's search queries.
OSS_REPOS = ""
DISCOVERY = "on"
# Autopilot & cost controls (the only knobs the owner needs to touch)
AUTO_SUBMIT = "on"                 # "off" = kill switch: patches only, no PRs
MAX_PRS_PER_DAY = "3"
MAX_OPEN_PRS_PER_REPO = "1"
CLA_POLICY = "skip"                # "flag" = submit anyway and remind the owner to sign
DAILY_LLM_CALLS = "40"             # Worker: diagnosis + reflection
EXECUTOR_DAILY_LLM_CALLS = "60"    # Executor: patches, self-review, follow-ups

[triggers]
# Each tick advances today's round by one bounded step: plan → scout one repo → ... → finalize + evolve.
crons = ["*/20 * * * *"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/rsi-status.json"]

[[d1_databases]]
binding = "DB"
database_name = "bug-hunter-rsi"
database_id = "62af57d8-c82c-47b0-8faf-6cc03bb02e8d"
migrations_dir = "migrations"

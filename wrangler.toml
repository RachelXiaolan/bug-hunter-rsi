name = "bug-hunter-rsi"
main = "src/index.js"
compatibility_date = "2026-09-23"

# Secrets (never put them here): CMD_API_KEY, GITHUB_TOKEN (optional, read-only), HUNTER_TOKEN
[vars]
# Team repos. Default write policy is readonly; append :review or :pr to allow more.
INTERNAL_REPOS = ""
# Open-source seed repos, e.g. "owner/repo:pr". Discovery adds more from the playbook's search queries.
OSS_REPOS = ""
DISCOVERY = "on"

[triggers]
# Each tick advances today's round by one bounded step: plan → scout one repo → ... → finalize + evolve.
crons = ["*/20 * * * *"]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "bug-hunter-rsi"
database_id = "62af57d8-c82c-47b0-8faf-6cc03bb02e8d"
migrations_dir = "migrations"
